meters:
- name: contributing_developers
  description: >-
    Count of contributing developers (those who open pull requests) billed per
    seat per month or year on the chosen plan.
  unit: developers
  aggregation: max
  dimensions:
  - account
  - plan
  - organization
- name: plan_subscription
  description: Active subscription tier (Free, Lite, Pro, Enterprise) per organization.
  unit: subscription
  aggregation: max
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track the count of contributing developers per organization and map to seats billed.
- name: Allocation
  description: Allocate per-developer seat cost to teams and repositories that generate pull requests.
- name: Optimization
  description: Use the free public-repo tier and the Free plan where adequate; right-size Lite vs. Pro to feature needs; favor annual billing for discount.
- name: Accountability
  description: Review active contributing-developer counts monthly and reconcile against billed seats.
