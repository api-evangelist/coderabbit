publisherName: CodeRabbit
serviceCategory: Developer Tools
billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Monthly or Annual
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: CodeRabbit
  ServiceCategory: Developer Tools
  ProviderName: CodeRabbit
  PublisherName: CodeRabbit
  InvoiceIssuerName: CodeRabbit
