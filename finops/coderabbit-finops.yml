created: '2026-06-21'
modified: '2026-06-21'
reconciled: true
tags:
- AI
- Code Review
- Developer Tools
- Pull Requests
- DevOps
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of CodeRabbit spend. CodeRabbit bills per contributing developer
  (developers who open pull requests) on subscription tiers (Free, Lite, Pro,
  Enterprise) rather than per-token or per-request usage. Pro is free forever
  for public repositories. Cost is driven by the count of active contributing
  developers and the chosen plan and billing cadence (monthly vs. annual).
notes: >-
  Per-developer prices and plan inclusions are subject to change; verify against
  the CodeRabbit pricing page during reconciliation.
sources:
- https://www.coderabbit.ai/pricing
- https://docs.coderabbit.ai/management/plans
- https://focus.finops.org/focus-specification/v1-3/
