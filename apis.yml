  description: REST API for generating developer activity reports over a date range,
    authenticated with the x-coderabbitai-api-key header. The POST /report.generate
    endpoint returns an on-demand report and supports prompt templates, grouping,
    and parameter filters.
- aid: coderabbit:coderabbit-git-app-integration
  name: CodeRabbit Git App Integration
  tags:
  - Git App
  - Pull Requests
  - Webhooks
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.coderabbit.ai/platforms/
  baseURL: https://app.coderabbit.ai
  properties:
  - url: https://docs.coderabbit.ai/platforms/
    type: Documentation
  - url: https://docs.coderabbit.ai/getting-started/quickstart
    type: GettingStarted
  description: CodeRabbit installs as a Git application on GitHub, GitLab, Bitbucket,
    and Azure DevOps, subscribing to pull/merge request events to post AI reviews,
    summaries, and chat replies. Integration is event-driven rather than a public
    REST surface.
- aid: coderabbit:coderabbit-configuration
