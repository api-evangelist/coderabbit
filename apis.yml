  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.coderabbit.ai/getting-started/configure-coderabbit
  baseURL: https://docs.coderabbit.ai
  properties:
  - url: https://docs.coderabbit.ai/getting-started/configure-coderabbit
    type: Documentation
  - url: https://docs.coderabbit.ai/reference/configuration
    type: Reference
  description: Per-repository behavior is configured with a .coderabbit.yaml file (validated
    against a published JSON schema) controlling review tone, path filters, enabled
    tools/linters, auto-review, and chat behavior.
