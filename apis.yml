description: CodeRabbit is an AI-powered code review platform that installs as a Git
  app (GitHub, GitLab, Bitbucket, Azure DevOps) to deliver line-by-line, context-aware
  reviews and summaries on pull requests, plus IDE and CLI reviews. It exposes a REST
  API for on-demand developer activity report generation and is configured per-repository
  with a .coderabbit.yaml file.
