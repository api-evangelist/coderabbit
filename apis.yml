  name: CodeRabbit Reports API
  tags:
  - Reports
  - Analytics
  - Developer Activity
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.coderabbit.ai/api-reference/report-generate
